<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Users | AdminKit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
    <script src="assets/js/app.js"></script>
</head>

<body>
    <main>
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
            <h1 class="h3 mb-0">Users</h1><a href="user-form.html" class="btn btn-primary"><i
                    class="bi bi-plus-lg me-1"></i>Add user</a>
        </div>
        <div class="card">
            <div class="card-header">
                <div class="row g-2 align-items-center">
                    <div class="col-md-4">
                        <div class="input-group"><span class="input-group-text"><i
                                    class="bi bi-search"></i></span><input id="q" class="form-control"
                                placeholder="Search..."></div>
                    </div>
                    <div class="col-md-8 text-md-end small text-body-secondary" id="info"></div>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
            <div class="card-footer">
                <ul class="pagination pagination-sm mb-0 justify-content-end" id="pager"></ul>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>const { badge, initials, esc } = App; App.list({ key: 'users', form: 'user-form.html', cols: [r => r.id, r => `<span class="avatar me-2">${initials(r.name)}</span>${esc(r.name)}`, r => esc(r.email), r => badge(r.role), r => badge(r.status)] })</script>
</body>

</html>F
