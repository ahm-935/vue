<!doctype html>
<html lang="en" data-bs-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings | AdminKit</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
<script src="assets/js/app.js"></script></head>
<body>
<main><h1 class="h3 mb-4">Settings</h1><div class="card mb-3" style="max-width:720px"><div class="card-header">Appearance</div><div class="card-body"><div class="row g-3"><div class="col-sm-4"><input type="radio" class="btn-check" name="theme" id="th-light" value="light" autocomplete="off"><label class="btn btn-outline-primary w-100 py-3" for="th-light"><i class="bi bi-sun d-block fs-3 mb-1"></i>Light</label></div><div class="col-sm-4"><input type="radio" class="btn-check" name="theme" id="th-dark" value="dark" autocomplete="off"><label class="btn btn-outline-primary w-100 py-3" for="th-dark"><i class="bi bi-moon-stars d-block fs-3 mb-1"></i>Dark</label></div><div class="col-sm-4"><input type="radio" class="btn-check" name="theme" id="th-auto" value="auto" autocomplete="off"><label class="btn btn-outline-primary w-100 py-3" for="th-auto"><i class="bi bi-circle-half d-block fs-3 mb-1"></i>System</label></div></div><p class="text-body-secondary small mt-3 mb-0">Your choice is saved in this browser.</p></div></div>
<div class="card" style="max-width:720px"><div class="card-header">Demo data</div><div class="card-body d-flex justify-content-between align-items-center"><span>Reset users, products and profile to the sample data.</span><button class="btn btn-outline-danger" id="reset">Reset</button></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>document.querySelectorAll('input[name=theme]').forEach(r=>{r.checked=r.value===App.Theme.get();r.addEventListener('change',()=>App.Theme.set(r.value))});
document.getElementById('reset').onclick=()=>App.confirmBox('Reset all demo data?',()=>{['users','products','profile'].forEach(k=>localStorage.removeItem(k));App.toast('Data reset')})</script>
</body></html>
