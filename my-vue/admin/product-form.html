<!doctype html>
<html lang="en" data-bs-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product | AdminKit</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
<script src="assets/js/app.js"></script></head>
<body>
<main><div class="d-flex justify-content-between align-items-center mb-4"><h1 class="h3 mb-0" id="ftitle">Product</h1><a href="products.html" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a></div>
<div class="card"><div class="card-body"><form id="f" class="row g-3 needs-validation" novalidate><div class="col-md-6"><label class="form-label">Product name</label><input type="text" name="name" class="form-control" required><div class="invalid-feedback">Required.</div></div><div class="col-md-6"><label class="form-label">SKU</label><input type="text" name="sku" class="form-control" required><div class="invalid-feedback">Required.</div></div><div class="col-md-6"><label class="form-label">Category</label><select name="category" class="form-select" required><option>Accessories</option><option>Displays</option><option>Electronics</option><option>Furniture</option></select></div><div class="col-md-6"><label class="form-label">Status</label><select name="status" class="form-select" required><option>Active</option><option>Draft</option><option>Out of stock</option></select></div><div class="col-md-6"><label class="form-label">Price ($)</label><input type="number" name="price" class="form-control" required min="0" step="0.01"><div class="invalid-feedback">Enter a valid price.</div></div><div class="col-md-6"><label class="form-label">Stock</label><input type="number" name="stock" class="form-control" required min="0" step="1"><div class="invalid-feedback">Enter stock quantity.</div></div><div class="col-12 d-flex gap-2"><button class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save</button><a href="products.html" class="btn btn-light">Cancel</a></div></form></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>App.form({key:'products',label:'product',back:'products.html',num:['price','stock']})</script>
</body></html>
