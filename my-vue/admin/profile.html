<!doctype html>
<html lang="en" data-bs-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile | AdminKit</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
<script src="assets/js/app.js"></script></head>
<body>
<main><h1 class="h3 mb-4">My profile</h1><div class="row g-3">
<div class="col-lg-4"><div class="card text-center"><div class="card-body"><span class="avatar avatar-xl mb-3" id="av"></span><h2 class="h5 mb-0" id="pn"></h2><div class="text-body-secondary" id="pr"></div><hr>
<div class="text-start small"><div class="mb-2"><i class="bi bi-envelope me-2"></i><span id="pe"></span></div><div class="mb-2"><i class="bi bi-telephone me-2"></i><span id="pp"></span></div><div><i class="bi bi-geo-alt me-2"></i><span id="pl"></span></div></div></div></div></div>
<div class="col-lg-8"><div class="card"><div class="card-header"><ul class="nav nav-tabs card-header-tabs"><li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#t1">Details</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#t2">Password</button></li></ul></div>
<div class="card-body tab-content"><div class="tab-pane fade show active" id="t1"><form id="f" class="row g-3 needs-validation" novalidate>
<div class="col-md-6"><label class="form-label">Full name</label><input name="name" class="form-control" required></div><div class="col-md-6"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
<div class="col-md-6"><label class="form-label">Phone</label><input name="phone" class="form-control"></div><div class="col-md-6"><label class="form-label">Role</label><input name="role" class="form-control" readonly></div>
<div class="col-12"><label class="form-label">Location</label><input name="location" class="form-control"></div><div class="col-12"><label class="form-label">Bio</label><textarea name="bio" rows="3" class="form-control"></textarea></div>
<div class="col-12"><button class="btn btn-primary">Save changes</button></div></form></div>
<div class="tab-pane fade" id="t2"><form id="pf" class="needs-validation" novalidate style="max-width:420px">
<div class="mb-3"><label class="form-label">Current password</label><input type="password" class="form-control" required></div><div class="mb-3"><label class="form-label">New password</label><input type="password" name="a" class="form-control" minlength="6" required></div>
<div class="mb-3"><label class="form-label">Confirm new password</label><input type="password" name="b" class="form-control" required></div><button class="btn btn-primary">Update password</button></form></div></div></div></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>const {Store,SEED,esc,initials}=App,f=document.getElementById('f');let p=Store.load('profile',SEED.profile);
const show=()=>{av.textContent=initials(p.name);pn.textContent=p.name;pr.textContent=p.role;pe.textContent=p.email;pp.textContent=p.phone;pl.textContent=p.location;[...f.elements].forEach(e=>e.name&&(e.value=p[e.name]||''))};show();
f.addEventListener('submit',e=>{e.preventDefault();f.classList.add('was-validated');if(!f.checkValidity())return;Object.assign(p,Object.fromEntries(new FormData(f)));Store.save('profile',p);show();App.toast('Profile saved')});
const pf=document.getElementById('pf');pf.addEventListener('submit',e=>{e.preventDefault();pf.b.setCustomValidity(pf.a.value===pf.b.value?'':'x');pf.classList.add('was-validated');if(pf.checkValidity()){pf.reset();pf.classList.remove('was-validated');App.toast('Password updated')}})</script>
</body></html>
