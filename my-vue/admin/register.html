<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register | AdminKit</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/style.css" rel="stylesheet" />
    <script src="assets/js/app.js"></script>
  </head>
  <body>
    <button
      class="btn btn-outline-secondary btn-sm position-fixed top-0 end-0 m-3"
      data-theme-toggle
      title="Toggle theme"
    >
      <i class="bi bi-circle-half"></i>
    </button>
    <div class="auth-wrap">
      <div class="card auth-card shadow-sm">
        <div class="card-body p-4">
          <div class="text-center mb-4">
            <i class="bi bi-grid-1x2-fill text-primary fs-1"></i>
            <h1 class="h4 mt-2">Create account</h1>
          </div>
          <form id="f" class="needs-validation" novalidate>
            <div class="mb-3">
              <label class="form-label">Full name</label
              ><input name="name" class="form-control" required />
              <div class="invalid-feedback">Required.</div>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label
              ><input type="email" name="email" class="form-control" required />
              <div class="invalid-feedback">Enter a valid email.</div>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <div class="input-group">
                <input
                  type="password"
                  name="p1"
                  class="form-control"
                  minlength="6"
                  required
                  placeholder=""
                /><button
                  type="button"
                  class="btn btn-outline-secondary"
                  data-pw-toggle
                >
                  <i class="bi bi-eye"></i>
                </button>
                <div class="invalid-feedback">Min. 6 characters.</div>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Confirm password</label>
              <div class="input-group">
                <input
                  type="password"
                  name="p2"
                  class="form-control"
                  minlength="6"
                  required
                  placeholder=""
                /><button
                  type="button"
                  class="btn btn-outline-secondary"
                  data-pw-toggle
                >
                  <i class="bi bi-eye"></i>
                </button>
                <div class="invalid-feedback">Min. 6 characters.</div>
              </div>
            </div>
            <div class="form-check mb-3">
              <input
                class="form-check-input"
                type="checkbox"
                id="t"
                required
              /><label class="form-check-label" for="t"
                >I agree to the terms</label
              >
            </div>
            <button class="btn btn-primary w-100">Register</button>
          </form>
          <p class="text-center mt-3 mb-0 small">
            Already registered? <a href="login.html">Sign in</a>
          </p>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const f = document.getElementById("f");
      f.addEventListener("submit", (e) => {
        e.preventDefault();
        const a = f.p1,
          b = f.p2;
        b.setCustomValidity(a.value === b.value ? "" : "Mismatch");
        f.classList.add("was-validated");
        if (f.checkValidity()) {
          const p = App.Store.load("profile", App.SEED.profile);
          p.name = f.name.value;
          p.email = f.email.value;
          App.Store.save("profile", p);
          localStorage.setItem("auth", "1");
          location.href = "index.html";
        }
      });
    </script>
  </body>
</html>
